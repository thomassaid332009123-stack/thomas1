<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cupMart - Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="cart.css">
</head>
<body class="bg-dark text-light">

    <div class="container py-5">
        <h1 class="text-teal fw-bold mb-4">Your Shopping Cart</h1>
        <a href="catalog.html" class="btn btn-outline-teal btn-sm mb-4">Continue Shopping</a>

        <div class="row">
            <div class="col-md-8">
                <div id="cart-items-container" class="bg-secondary-dark p-4 rounded border border-secondary mb-3">
                </div>
            </div>
            <div class="col-md-4">
                <div class="bg-secondary-dark p-4 rounded border border-secondary">
                    <h4 class="text-teal mb-3">Order Summary</h4>
                    <p class="d-flex justify-content-between">Total Items: <span id="total-items">0</span></p>
                    <h3 class="d-flex justify-content-between border-top border-secondary pt-3">Total Price: <span id="total-price" class="text-teal">$0.00</span></h3>
                    <button onclick="goToCheckout()" class="btn btn-teal w-100 mt-4">Proceed to Checkout</button>
                    <button onclick="clearCart()" class="btn btn-outline-danger btn-sm w-100 mt-2">Clear Cart</button>
                </div>
            </div>
        </div>
    </div>

    <script src="cart.js?v=1.1"></script>
</body>
</html>
