<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cupMart - Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="checkout.css">
</head>
<body class="bg-dark text-light py-5">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-7 bg-secondary-dark p-4 border border-secondary rounded shadow">
                <h3 class="text-teal text-center mb-4 fw-bold">Secure Checkout</h3>
                
                <form id="payment-form" onsubmit="processPayment(event)">
                    
                    <h5 class="text-teal mb-3 border-bottom border-secondary pb-2">1. Shipping Information</h5>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label text-white small">Country</label>
                            <input type="text" id="shipping-country" class="form-control bg-dark text-white border-secondary" placeholder="e.g. Egypt" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label text-white small">Governorate</label>
                            <input type="text" id="shipping-gov" class="form-control bg-dark text-light border-secondary" placeholder="e.g. Cairo" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label text-white small">Phone Number</label>
                            <input type="tel" id="shipping-phone" class="form-control bg-dark text-light border-secondary" placeholder="01xxxxxxxxx" required>
                        </div>
                    </div>

                    <h5 class="text-teal mb-3 border-bottom border-secondary pb-2">2. Payment Method</h5>
                    <div class="mb-4">
                        <div class="form-check p-3 border border-secondary rounded mb-3">
                            <input class="form-check-input ms-1" type="radio" name="paymentMethod" id="visa" value="visa" checked onclick="togglePaymentFields('visa')">
                            <label class="form-check-label ms-3 text-light" for="visa">💳 Credit / Visa Card</label>
                        </div>
                        <div class="form-check p-3 border border-secondary rounded">
                            <input class="form-check-input ms-1" type="radio" name="paymentMethod" id="wallet" value="wallet" onclick="togglePaymentFields('wallet')">
                            <label class="form-check-label ms-3 text-light" for="wallet">📱 Smart Wallet (Vodafone Cash / Orange)</label>
                        </div>
                    </div>

                    <div id="visa-fields" class="mb-4">
                        <div class="mb-3">
                            <label class="form-label text-white small">Card Number</label>
                            <input type="text" id="card-num" class="form-control bg-dark text-light border-secondary" placeholder="1234 5678 9101 1121">
                        </div>
                        <div class="row">
                            <div class="col-6">
                                <label class="form-label text-white small">Expiry</label>
                                <input type="text" id="card-exp" class="form-control bg-dark text-light border-secondary" placeholder="MM/YY">
                            </div>
                            <div class="col-6">
                                <label class="form-label text-white small">CVV</label>
                                <input type="password" id="card-cvv" class="form-control bg-dark text-light border-secondary" placeholder="***">
                            </div>
                        </div>
                    </div>

                    <div id="wallet-fields" class="mb-4 d-none">
                        <div class="mb-3">
                            <label class="form-label text-white small">Wallet Phone Number</label>
                            <input type="text" id="wallet-phone" class="form-control bg-dark text-light border-secondary" placeholder="01xxxxxxxxx">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-teal w-100 py-2 fs-5">Pay Now</button>
                </form>
                
                <div class="text-center mt-3">
                    <a href="cart.html" class="text-white small text-decoration-none">&larr; Back to Cart</a>
                </div>
            </div>
        </div>
    </div>

    <script src="checkout.js?v=2.0"></script>
</body>
</html>
