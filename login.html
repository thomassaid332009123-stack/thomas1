<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cupMart - Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="auth.css">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container py-5">
        <div class="row justify-content-center">
            
            <div id="login-box" class="col-md-5 bg-secondary-dark p-4 border border-secondary rounded shadow">
                <h3 class="text-teal text-center mb-4 fw-bold">Account Log In</h3>
                <form id="login-form" onsubmit="handleLoginSubmit(event)">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email Address</label>
                        <input type="email" id="login-email" class="form-control bg-dark text-light border-secondary" required placeholder="name@example.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Password</label>
                        <input type="password" id="login-password" class="form-control bg-dark text-light border-secondary" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-teal w-100 mb-3">Log In</button>
                </form>
                <p class="text-center small text-muted mb-0">Don't have an account? <a href="#" class="text-teal" onclick="toggleAuthForms('signup')">Sign Up Here</a></p>
                <div class="text-center mt-3"><a href="index.html" class="text-muted small text-decoration-none">&larr; Back to Home</a></div>
            </div>

            <div id="signup-box" class="col-md-5 bg-secondary-dark p-4 border border-secondary rounded shadow d-none">
                <h3 class="text-teal text-center mb-4 fw-bold">Create Account</h3>
                <form id="signup-form" onsubmit="handleSignupSubmit(event)">
                    <div class="mb-3">
                        <label class="form-label text-muted small">Full Name</label>
                        <input type="text" id="signup-name" class="form-control bg-dark text-light border-secondary" required placeholder="John Doe">
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Email Address</label>
                        <input type="email" id="signup-email" class="form-control bg-dark text-light border-secondary" required placeholder="name@example.com">
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small">Choose Password</label>
                        <input type="password" id="signup-password" class="form-control bg-dark text-light border-secondary" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-teal w-100 mb-3">Sign Up</button>
                </form>
                <p class="text-center small text-muted mb-0">Already registered? <a href="#" class="text-teal" onclick="toggleAuthForms('login')">Log In Here</a></p>
                <div class="text-center mt-3"><a href="index.html" class="text-muted small text-decoration-none">&larr; Back to Home</a></div>
            </div>

        </div>
    </div>

    <script src="auth.js?v=1.1"></script>
</body>
</html>
