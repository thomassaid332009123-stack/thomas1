<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>cupMart - Product Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="product-details.css">
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark sticky-top shadow">
        <div class="container">
            <a class="navbar-brand" href="index.html">cupMart STORE</a>
            <div class="d-flex align-items-center gap-3 ms-auto">
                <a href="catalog.html" class="btn btn-outline-teal btn-sm">Catalog</a>
                <a href="cart.html" class="btn btn-outline-teal btn-sm position-relative">
                    Cart 🛒
                    <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger">0</span>
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div id="product-container" class="row g-5">
            <div class="col-12 text-center py-5">
                <div class="spinner-border text-info" role="status">
                    <span class="visually-hidden">Loading Product Details...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="product-details.js"></script>
</body>
</html>
